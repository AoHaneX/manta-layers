name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-release.yml"
      - "packaging/**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Test and package Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Verify the application version and tag
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Encoding UTF8 "app/__init__.py"
          $match = [regex]::Match($source, '__version__\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Cannot read app/__init__.py version."
          }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Git tag $env:GITHUB_REF_NAME does not match app version v$version."
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building Manta Layers $version"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Check Inno Setup 6 availability
        shell: pwsh
        run: |
          $inno = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) {
            throw "Inno Setup 6 / ISCC.exe is missing on the Windows runner."
          }

      - name: Build portable ZIP and Windows installer
        shell: pwsh
        run: |
          & .\packaging\build.ps1 -Python "python" -PythonArguments @()
          $expected = @(
            "dist\release\MantaLayers-$env:APP_VERSION-Setup.exe",
            "dist\release\MantaLayers-$env:APP_VERSION-Windows-Portable.zip",
            "dist\release\SHA256SUMS.txt"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              throw "Missing release artifact: $file"
            }
          }

      - name: Upload build artifacts for verification
        uses: actions/upload-artifact@v4
        with:
          name: MantaLayers-Windows-${{ env.APP_VERSION }}
          path: |
            dist/release/MantaLayers-*-Setup.exe
            dist/release/MantaLayers-*-Windows-Portable.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Tag builds produce a draft rather than an immediately public release.
      # Verify the files and installation before publishing.
      - name: Create or update draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Manta Layers v${{ env.APP_VERSION }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/MantaLayers-*-Setup.exe
            dist/release/MantaLayers-*-Windows-Portable.zip
            dist/release/SHA256SUMS.txt
